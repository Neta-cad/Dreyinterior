<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Drey Interior</title>
  <meta name="theme-color" content="#0B1513">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Jost:wght@300;400;500;600;700&display=swap">

  <style>
    :root {
      --bg: #0B1513;
      --panel: #12201D;
      --panel-2: #172A26;
      --line: #223835;
      --text: #E8F0ED;
      --muted: #8FA39D;
      --teal: #2BB3A0;
      --teal-dark: #1E8E7E;
      --oak: #D79A4C;
      --green: #4CBF7A;
      --rose: #E0705F;
      --violet: #9B8CE0;
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: 'Jost', 'Segoe UI', system-ui, sans-serif;
      font-size: 1rem; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; color: inherit; }
    h1, h2, h3 { margin: 0; }
    [hidden] { display: none !important; }
    svg { display: block; }
    i[data-lucide] { display: inline-flex; }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

    .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 1rem; }

    /* ---------- TOP BAR ---------- */
    .topbar { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50; }
    .topbar-inner { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 0; flex-wrap: wrap; }
    .icon-btn {
      width: 46px; height: 46px; border-radius: 12px; border: 0; cursor: pointer;
      background: var(--teal); color: #06201C;
      display: inline-flex; align-items: center; justify-content: center; flex: none;
    }
    .icon-btn svg { width: 24px; height: 24px; }
    .title-block { flex: 1; min-width: 140px; }
    .title-block h1 { font-size: 1.25rem; font-weight: 700; line-height: 1.2; }
    .title-block p { margin: 0.1rem 0 0; color: var(--muted); font-size: 0.85rem; }
    .top-actions { display: flex; gap: 0.5rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      min-height: 46px; padding: 0.6rem 1.1rem; border-radius: 12px; border: 1px solid transparent;
      font-weight: 600; cursor: pointer; transition: background 0.2s, border-color 0.2s;
    }
    .btn svg { width: 18px; height: 18px; }
    .btn-primary { background: var(--teal); color: #06201C; }
    .btn-primary:hover { background: #4CC9B7; }
    .btn-dark { background: var(--panel-2); border-color: var(--line); color: var(--text); }
    .btn-dark:hover { border-color: var(--teal); }
    .btn[disabled] { opacity: 0.55; cursor: not-allowed; }

    /* ---------- MENU ---------- */
    .menu { position: absolute; left: 0; right: 0; top: 100%; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: 0 18px 30px rgba(0,0,0,0.4); }
    .menu-inner { display: grid; padding: 0.5rem 1rem 1rem; gap: 0.25rem; max-width: 1100px; margin: 0 auto; }
    .menu-item {
      display: flex; align-items: center; gap: 0.8rem; padding: 0.85rem 0.9rem; border-radius: 12px;
      background: none; border: 0; text-align: left; cursor: pointer; width: 100%; color: var(--text);
    }
    .menu-item:hover { background: var(--panel-2); }
    .menu-item svg { width: 20px; height: 20px; color: var(--teal); }

    /* ---------- STATS ---------- */
    main { padding: 1.25rem 0 3rem; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; margin-bottom: 1.5rem; }
    .stat {
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 1rem 1rem 1.1rem; display: grid; gap: 0.9rem;
    }
    .stat-top { display: flex; justify-content: space-between; gap: 0.5rem; align-items: flex-start; }
    .stat-label { color: var(--muted); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .tile { width: 42px; height: 42px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
    .tile svg { width: 20px; height: 20px; }
    .tile-teal { background: rgba(43,179,160,0.16); color: var(--teal); }
    .tile-oak { background: rgba(215,154,76,0.16); color: var(--oak); }
    .tile-green { background: rgba(76,191,122,0.16); color: var(--green); }
    .tile-violet { background: rgba(155,140,224,0.16); color: var(--violet); }
    .tile-rose { background: rgba(224,112,95,0.16); color: var(--rose); }
    .stat-value { font-size: 2.1rem; font-weight: 700; line-height: 1; }
    .stat-note { color: var(--muted); font-size: 0.92rem; margin-top: 0.3rem; }
    @media (min-width: 900px) { .stat-grid { grid-template-columns: repeat(3, 1fr); gap: 1rem; } }

    /* ---------- PANELS ---------- */
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 1.5rem; overflow: hidden; }
    .panel-head { display: flex; align-items: center; gap: 0.6rem; padding: 1rem 1.1rem; border-bottom: 1px solid var(--line); }
    .panel-head svg { width: 22px; height: 22px; color: var(--oak); }
    .panel-head h2 { font-size: 1.2rem; font-weight: 700; }
    .panel-body { padding: 1.1rem; }

    .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
    .quick {
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px;
      min-height: 112px; padding: 1rem 0.8rem; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.7rem; text-align: center;
      cursor: pointer; font-weight: 600; transition: border-color 0.2s, transform 0.2s;
    }
    .quick:hover { border-color: var(--teal); transform: translateY(-2px); }
    .quick svg { width: 28px; height: 28px; color: var(--teal); }
    @media (min-width: 900px) { .quick-grid { grid-template-columns: repeat(4, 1fr); } }

    /* ---------- BOOKINGS ---------- */
    .toolbar { display: grid; gap: 0.7rem; grid-template-columns: 1fr; margin-bottom: 1rem; }
    @media (min-width: 700px) { .toolbar { grid-template-columns: 240px 1fr; } }
    .input, select.input, textarea.input {
      width: 100%; min-height: 48px; padding: 0.7rem 0.9rem; border-radius: 12px;
      background: #0E1B18; border: 1px solid var(--line); color: var(--text);
    }
    textarea.input { min-height: 84px; resize: vertical; }
    .input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(43,179,160,0.18); }
    .input::placeholder { color: #5F7872; }
    select.input option { background: #12201D; color: var(--text); }

    .booking-list { display: grid; gap: 1rem; }
    .booking {
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem;
    }
    .booking-top { display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
    .booking-top h3 { font-size: 1.2rem; font-weight: 700; }
    .booking-ref { color: var(--muted); font-size: 0.82rem; margin-top: 0.15rem; }
    .badges { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: flex-start; }
    .badge { display: inline-block; padding: 0.2rem 0.7rem; border-radius: 999px; font-size: 0.78rem; font-weight: 600; border: 1px solid var(--line); color: var(--muted); }
    .badge-new { background: rgba(43,179,160,0.16); border-color: rgba(43,179,160,0.4); color: var(--teal); }
    .badge-active { background: rgba(215,154,76,0.16); border-color: rgba(215,154,76,0.4); color: var(--oak); }
    .badge-done { background: rgba(76,191,122,0.16); border-color: rgba(76,191,122,0.4); color: var(--green); }
    .badge-cancel { background: rgba(224,112,95,0.16); border-color: rgba(224,112,95,0.4); color: var(--rose); }

    .details { display: grid; gap: 0.6rem 1.5rem; grid-template-columns: 1fr; margin: 0 0 1rem; }
    @media (min-width: 700px) { .details { grid-template-columns: 1fr 1fr; } }
    .details dt { color: var(--muted); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .details dd { margin: 0.1rem 0 0; word-break: break-word; }
    .details a { color: var(--teal); text-decoration: underline; text-underline-offset: 3px; }
    .note-box { background: #0E1B18; border: 1px solid var(--line); border-radius: 12px; padding: 0.75rem 0.9rem; margin-bottom: 1rem; font-size: 0.95rem; }

    .controls { display: grid; gap: 0.8rem; grid-template-columns: 1fr; border-top: 1px solid var(--line); padding-top: 1rem; }
    @media (min-width: 700px) { .controls { grid-template-columns: 1fr 1fr; } }
    .controls label { display: block; margin-bottom: 0.35rem; font-size: 0.85rem; color: var(--muted); font-weight: 500; }
    .controls .wide { grid-column: 1 / -1; }
    .save-row { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
    .saved-msg { color: var(--green); font-size: 0.9rem; font-weight: 500; }
    .empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }

    .alert { padding: 0.85rem 1rem; border-radius: 12px; margin-bottom: 1rem; border: 1px solid; font-size: 0.95rem; }
    .alert-error { border-color: rgba(224,112,95,0.5); background: rgba(224,112,95,0.12); color: #F0B3A9; }
    .alert-info { border-color: rgba(43,179,160,0.5); background: rgba(43,179,160,0.12); color: #BFE9E2; }

    /* ---------- LOGIN ---------- */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem; }
    .login-card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 2rem 1.5rem; }
    .login-brand { font-family: 'Bodoni Moda', Georgia, serif; font-size: 1.7rem; font-weight: 600; margin-bottom: 0.2rem; }
    .login-sub { color: var(--muted); margin: 0 0 1.5rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--muted); font-weight: 500; }
  </style>
</head>
<body>

  <!-- NOT CONNECTED -->
  <div class="wrap" id="setupView" hidden style="padding-top: 2rem;">
    <div class="alert alert-info">
      The dashboard is not connected yet. Add the Supabase URL and anon key to <strong>js/config.js</strong>, then reload this page.
    </div>
  </div>

  <!-- LOGIN -->
  <div class="login-wrap" id="loginView" hidden>
    <div class="login-card">
      <div class="login-brand">Drey Interior</div>
      <p class="login-sub">Admin login</p>
      <div class="alert alert-error" id="loginAlert" role="alert" hidden></div>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">Email</label>
          <input class="input" id="loginEmail" type="email" autocomplete="username" inputmode="email">
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input class="input" id="loginPassword" type="password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;">Log in</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashView" hidden>

    <header class="topbar">
      <div class="wrap topbar-inner">
        <button type="button" class="icon-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
          <i data-lucide="menu" aria-hidden="true"></i>
        </button>
        <div class="title-block">
          <h1>Bookings Overview</h1>
          <p id="lastUpdated">Last updated: --</p>
        </div>
        <div class="top-actions">
          <button type="button" class="btn btn-primary" id="refreshBtn"><i data-lucide="refresh-cw" aria-hidden="true"></i><span>Refresh</span></button>
          <a class="btn btn-dark" href="index.html" target="_blank" rel="noopener"><span>View Site</span><i data-lucide="arrow-up-right" aria-hidden="true"></i></a>
        </div>
      </div>
      <nav class="menu" id="menu" hidden aria-label="Admin menu">
        <div class="menu-inner">
          <button type="button" class="menu-item" data-menu="top"><i data-lucide="layout-dashboard" aria-hidden="true"></i><span>Overview</span></button>
          <button type="button" class="menu-item" data-menu="bookings"><i data-lucide="clipboard-list" aria-hidden="true"></i><span>All bookings</span></button>
          <button type="button" class="menu-item" data-menu="new"><i data-lucide="inbox" aria-hidden="true"></i><span>New bookings</span></button>
          <button type="button" class="menu-item" data-menu="upcoming"><i data-lucide="calendar-clock" aria-hidden="true"></i><span>Upcoming visits</span></button>
          <button type="button" class="menu-item" data-menu="logout"><i data-lucide="log-out" aria-hidden="true"></i><span>Log out</span></button>
        </div>
      </nav>
    </header>

    <main>
      <div class="wrap">

        <div class="alert alert-error" id="dashAlert" role="alert" hidden></div>

        <div class="stat-grid" id="stats"></div>

        <section class="panel">
          <div class="panel-head"><i data-lucide="zap" aria-hidden="true"></i><h2>Quick Actions</h2></div>
          <div class="panel-body">
            <div class="quick-grid">
              <button type="button" class="quick" data-quick="new"><i data-lucide="inbox" aria-hidden="true"></i><span>Review New Bookings</span></button>
              <button type="button" class="quick" data-quick="upcoming"><i data-lucide="calendar-clock" aria-hidden="true"></i><span>Upcoming Visits</span></button>
              <button type="button" class="quick" data-quick="in_production"><i data-lucide="hammer" aria-hidden="true"></i><span>In Production</span></button>
              <button type="button" class="quick" data-quick="quote_sent"><i data-lucide="file-text" aria-hidden="true"></i><span>Quotes Sent</span></button>
            </div>
          </div>
        </section>

        <section class="panel" id="bookingsPanel">
          <div class="panel-head"><i data-lucide="clipboard-list" aria-hidden="true"></i><h2>Bookings</h2></div>
          <div class="panel-body">
            <div class="toolbar">
              <select class="input" id="filterStatus" aria-label="Filter bookings"></select>
              <input class="input" id="searchBox" type="search" placeholder="Search name, phone, reference or state" aria-label="Search bookings">
            </div>
            <div class="booking-list" id="bookingList"></div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script>
    (function () {
      "use strict";

      var C = window.DREY_CONFIG;
      var D = window.DREY;
      var B = C.backend;

      function el(id) { return document.getElementById(id); }

      function esc(value) {
        var map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) { return map[ch]; });
      }

      function icons() {
        if (window.lucide && typeof window.lucide.createIcons === "function") window.lucide.createIcons();
      }

      function icon(name) { return '<i data-lucide="' + name + '" aria-hidden="true"></i>'; }

      var STATUSES = [
        { value: "new",             label: "New" },
        { value: "contacted",       label: "Contacted" },
        { value: "visit_scheduled", label: "Visit scheduled" },
        { value: "quote_sent",      label: "Quote sent" },
        { value: "in_production",   label: "In production" },
        { value: "delivered",       label: "Delivered" },
        { value: "cancelled",       label: "Cancelled" }
      ];

      var PAYMENTS = [
        { value: "pending",        label: "Nothing paid yet" },
        { value: "visit_fee_paid", label: "Visit fee paid" },
        { value: "deposit_paid",   label: "Deposit paid" },
        { value: "paid_in_full",   label: "Paid in full" }
      ];

      function labelFor(list, value) {
        var found = list.filter(function (x) { return x.value === value; })[0];
        return found ? found.label : value;
      }

      function statusBadge(value) {
        var cls = "";
        if (value === "new") cls = "badge-new";
        else if (value === "delivered") cls = "badge-done";
        else if (value === "cancelled") cls = "badge-cancel";
        else cls = "badge-active";
        return '<span class="badge ' + cls + '">' + esc(labelFor(STATUSES, value)) + "</span>";
      }

      function paymentBadge(value) {
        var cls = value === "pending" ? "" : "badge-done";
        return '<span class="badge ' + cls + '">' + esc(labelFor(PAYMENTS, value)) + "</span>";
      }

      function localToday() {
        var d = new Date();
        function pad(n) { return (n < 10 ? "0" : "") + n; }
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }

      /* ---------- Views ---------- */
      function show(which) {
        el("setupView").hidden = which !== "setup";
        el("loginView").hidden = which !== "login";
        el("dashView").hidden = which !== "dash";
        document.body.style.background = which === "login" ? "radial-gradient(circle at 50% 0%, #153029, #0B1513 60%)" : "";
        icons();
      }

      if (!D.isSet(B.supabaseUrl) || !D.isSet(B.supabaseAnonKey) || !window.supabase) {
        show("setup");
        return;
      }

      var db = window.supabase.createClient(B.supabaseUrl, B.supabaseAnonKey);
      var TABLE = B.bookingsTable;
      var bookings = [];

      /* ---------- Menu ---------- */
      var menu = el("menu");
      var menuBtn = el("menuBtn");

      function setMenu(open) {
        menu.hidden = !open;
        menuBtn.setAttribute("aria-expanded", String(open));
        menuBtn.innerHTML = icon(open ? "x" : "menu");
        icons();
      }

      menuBtn.addEventListener("click", function () { setMenu(menu.hidden); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMenu(false); });

      function goTo(filter) {
        el("filterStatus").value = filter;
        render();
        el("bookingsPanel").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      menu.addEventListener("click", function (event) {
        var item = event.target.closest("[data-menu]");
        if (!item) return;
        var action = item.getAttribute("data-menu");
        setMenu(false);
        if (action === "top") window.scrollTo({ top: 0, behavior: "smooth" });
        else if (action === "bookings") goTo("");
        else if (action === "new") goTo("new");
        else if (action === "upcoming") goTo("upcoming");
        else if (action === "logout") logout();
      });

      el("dashView").addEventListener("click", function (event) {
        var q = event.target.closest("[data-quick]");
        if (q) goTo(q.getAttribute("data-quick"));
      });

      /* ---------- Login ---------- */
      el("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();
        var alertBox = el("loginAlert");
        alertBox.hidden = true;

        var email = el("loginEmail").value.trim();
        var password = el("loginPassword").value;
        if (!email || !password) {
          alertBox.textContent = "Enter your email and password.";
          alertBox.hidden = false;
          return;
        }

        var btn = el("loginBtn");
        btn.disabled = true;
        btn.textContent = "Logging in...";

        db.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
          btn.disabled = false;
          btn.textContent = "Log in";
          if (res.error) {
            alertBox.textContent = "Login failed. Check your email and password.";
            alertBox.hidden = false;
            return;
          }
          el("loginPassword").value = "";
          openDashboard();
        });
      });

      function logout() {
        db.auth.signOut().then(function () {
          bookings = [];
          show("login");
        });
      }

      /* ---------- Loading ---------- */
      function openDashboard() {
        show("dash");
        loadBookings();
      }

      function loadBookings() {
        el("dashAlert").hidden = true;
        var btn = el("refreshBtn");
        btn.disabled = true;

        db.from(TABLE).select("*").order("created_at", { ascending: false }).limit(500).then(function (res) {
          btn.disabled = false;
          if (res.error) {
            el("dashAlert").textContent = "Could not load bookings. Check that the table and policies from the setup step are in place.";
            el("dashAlert").hidden = false;
            el("bookingList").innerHTML = "";
            return;
          }
          bookings = res.data || [];
          el("lastUpdated").textContent = "Last updated: " + new Date().toLocaleTimeString("en-GB");
          render();
        });
      }

      el("refreshBtn").addEventListener("click", loadBookings);

      /* ---------- Rendering ---------- */
      function formatDate(value) {
        if (!value) return "";
        return new Date(value + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
      }

      function formatCreated(value) {
        return new Date(value).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      }

      function customerWhatsapp(phone) {
        var digits = String(phone || "").replace(/\D/g, "");
        if (digits.charAt(0) === "0" && digits.length === 11) digits = "234" + digits.slice(1);
        return digits ? "https://wa.me/" + digits : "";
      }

      function isUpcoming(b, today) {
        return b.visit_date >= today && b.status !== "cancelled" && b.status !== "delivered";
      }

      function renderStats() {
        var today = localToday();
        var total = bookings.length;
        var fresh = bookings.filter(function (b) { return b.status === "new"; }).length;
        var upcoming = bookings.filter(function (b) { return isUpcoming(b, today); }).length;
        var production = bookings.filter(function (b) { return b.status === "in_production"; }).length;
        var paid = bookings.filter(function (b) { return b.payment_status !== "pending"; }).length;
        var delivered = bookings.filter(function (b) { return b.status === "delivered"; }).length;

        function stat(label, value, note, iconName, tile) {
          return '<div class="stat"><div class="stat-top"><span class="stat-label">' + label + "</span>" +
            '<span class="tile ' + tile + '">' + icon(iconName) + "</span></div>" +
            '<div><div class="stat-value">' + value + '</div><div class="stat-note">' + note + "</div></div></div>";
        }

        el("stats").innerHTML =
          stat("Total bookings", total, "All time", "clipboard-list", "tile-teal") +
          stat("New", fresh, "Needs a reply", "inbox", "tile-oak") +
          stat("Upcoming visits", upcoming, "Still to visit", "calendar-clock", "tile-violet") +
          stat("In production", production, "Being built", "hammer", "tile-oak") +
          stat("Payments", paid, "Bookings with a payment", "wallet", "tile-green") +
          stat("Delivered", delivered, "Completed", "package-check", "tile-teal");
      }

      function options(list, selected) {
        return list.map(function (x) {
          return '<option value="' + esc(x.value) + '"' + (x.value === selected ? " selected" : "") + ">" + esc(x.label) + "</option>";
        }).join("");
      }

      function row(label, value) {
        if (!value) return "";
        return "<div><dt>" + esc(label) + "</dt><dd>" + value + "</dd></div>";
      }

      function renderCard(b) {
        var wa = customerWhatsapp(b.phone);
        var furniture = [b.category, b.item_name].filter(Boolean).join(" - ");

        return '<article class="booking" data-id="' + esc(b.id) + '">' +
          '<div class="booking-top">' +
            "<div><h3>" + esc(b.customer_name) + '</h3><div class="booking-ref">' + esc(b.reference) + " &middot; booked " + esc(formatCreated(b.created_at)) + "</div></div>" +
            '<div class="badges">' + statusBadge(b.status) + paymentBadge(b.payment_status) + "</div>" +
          "</div>" +
          '<dl class="details">' +
            row("Visit", esc(formatDate(b.visit_date)) + (b.visit_time ? " (" + esc(b.visit_time) + ")" : "")) +
            row("Phone", '<a href="tel:' + esc(String(b.phone).replace(/\s+/g, "")) + '">' + esc(b.phone) + "</a>" +
              (wa ? ' &middot; <a href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : "")) +
            row("Email", '<a href="mailto:' + esc(b.email) + '">' + esc(b.email) + "</a>") +
            row("Location", esc(b.address) + ", " + esc(b.state)) +
            row("Furniture", esc(furniture)) +
            row("Space", esc(b.room_type)) +
            row("Budget", esc(b.budget)) +
            row("Visit fee", b.visit_fee ? esc(C.business.currencySymbol + Number(b.visit_fee).toLocaleString("en-NG")) : "") +
          "</dl>" +
          (b.notes ? '<div class="note-box"><strong>Customer notes:</strong> ' + esc(b.notes) + "</div>" : "") +
          '<div class="controls">' +
            '<div><label>Booking status</label><select class="input" data-field="status">' + options(STATUSES, b.status) + "</select></div>" +
            '<div><label>Payment</label><select class="input" data-field="payment_status">' + options(PAYMENTS, b.payment_status) + "</select></div>" +
            '<div class="wide"><label>Your notes (only you see these)</label><textarea class="input" data-field="admin_notes">' + esc(b.admin_notes || "") + "</textarea></div>" +
            '<div class="save-row wide"><button type="button" class="btn btn-primary" data-action="save">Save changes</button><span class="saved-msg" hidden>Saved</span></div>' +
          "</div>" +
        "</article>";
      }

      function render() {
        renderStats();

        var filter = el("filterStatus").value;
        var term = el("searchBox").value.trim().toLowerCase();
        var today = localToday();

        var visible = bookings.filter(function (b) {
          if (filter === "upcoming") { if (!isUpcoming(b, today)) return false; }
          else if (filter && b.status !== filter) return false;
          if (!term) return true;
          return [b.customer_name, b.phone, b.reference, b.state, b.email, b.item_name]
            .join(" ").toLowerCase().indexOf(term) !== -1;
        });

        if (filter === "upcoming") {
          visible.sort(function (a, b) { return a.visit_date < b.visit_date ? -1 : 1; });
        }

        if (!visible.length) {
          el("bookingList").innerHTML = '<div class="empty">' +
            (bookings.length ? "No bookings match this filter." : "No bookings yet. They will appear here as customers book.") + "</div>";
        } else {
          el("bookingList").innerHTML = visible.map(renderCard).join("");
        }
        icons();
      }

      el("filterStatus").innerHTML = '<option value="">All bookings</option><option value="upcoming">Upcoming visits</option>' + options(STATUSES, "");
      el("filterStatus").addEventListener("change", render);
      el("searchBox").addEventListener("input", render);

      /* ---------- Saving ---------- */
      el("bookingList").addEventListener("click", function (event) {
        var btn = event.target.closest('[data-action="save"]');
        if (!btn) return;

        var card = btn.closest(".booking");
        var id = card.getAttribute("data-id");
        var msg = card.querySelector(".saved-msg");

        var update = {
          status: card.querySelector('[data-field="status"]').value,
          payment_status: card.querySelector('[data-field="payment_status"]').value,
          admin_notes: card.querySelector('[data-field="admin_notes"]').value.trim()
        };

        btn.disabled = true;
        btn.textContent = "Saving...";
        msg.hidden = true;

        db.from(TABLE).update(update).eq("id", id).then(function (res) {
          btn.disabled = false;
          btn.textContent = "Save changes";
          if (res.error) {
            el("dashAlert").textContent = "Could not save. Please log in again and retry.";
            el("dashAlert").hidden = false;
            window.scrollTo({ top: 0, behavior: "smooth" });
            return;
          }
          el("dashAlert").hidden = true;
          bookings.forEach(function (b) {
            if (b.id === id) { b.status = update.status; b.payment_status = update.payment_status; b.admin_notes = update.admin_notes; }
          });
          renderStats();
          icons();
          card.querySelector(".badges").innerHTML = statusBadge(update.status) + paymentBadge(update.payment_status);
          msg.hidden = false;
          setTimeout(function () { msg.hidden = true; }, 2500);
        });
      });

      /* ---------- Start ---------- */
      db.auth.getSession().then(function (res) {
        if (res.data && res.data.session) openDashboard();
        else show("login");
      });

      db.auth.onAuthStateChange(function (event) {
        if (event === "SIGNED_OUT") show("login");
      });
    })();
  </script>
</body>
</html>
